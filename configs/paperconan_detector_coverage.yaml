# PaperConan Detector Coverage Matrix
#
# Maps every PaperConan detector kind to its Veritas integration status.
# Each entry is tagged with one of:
#   - translated: PaperConan output is translated into Veritas canonical NumericSignal
#   - native_equivalent: Veritas already has a native detector covering the same signal
#   - native_superset: Veritas native detector covers the signal with additional context
#   - planned: Not yet integrated; scheduled for a future milestone
#   - not_applicable: Explicitly excluded with reason
#
# This matrix is the acceptance contract for WP0 (Milestone 1).
# PaperConan README detector kinds not listed here are a coverage gap.
#
# Updated: 2026-07-05

schema_version: "1.0"

# --- Column relations (pair-wise column detectors) ---
column_relations:
  - kind: identical_column
    family: column_relations
    status: translated
    veritas_target: canonical_numeric_signal
